# Fly.io config. Create the app + volume first:  fly launch --no-deploy && fly volumes create data --size 1
app = "trendpulse-CHANGE-ME"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/app.db"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0   # SQLite = single machine; do not scale out horizontally
